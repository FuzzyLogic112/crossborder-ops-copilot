# 平台佣金与支付手续费配置 —— 真实公开费率
#
# 数据来源与查询日期（2026-09-10 检索）：
#   Amazon 佣金：多家卖家服务商整理的 2026 费率表，标准类目 15%，消费电子 8%，
#                服饰 17%，Amazon 设备配件 45%（最高），每件最低 $0.30。
#                Amazon 官方声明 2026 年佣金比例未变，沿用 2025 结构。
#                权威来源应查 Seller Central 官方费率页，本文件数据来自第三方整理：
#                https://feedvisor.com/university/referral-fee/
#                https://www.inventoryhero.ai/blog/amazon-referral-fees
#   TikTok Shop 美区：referral fee 统一 6%（部分珠宝 5%），**已包含支付处理费，
#                无单独交易手续费**；新卖家 60 天内首单可享 30 天 3% 促销费率。
#                https://www.getonecart.com/tiktok-shop-seller-fees/
#                https://www.dashboardly.io/post/tiktok-shop-fees-2026-the-complete-seller-fee-guide
#   独立站支付：Stripe 美区线上卡费率 2.9% + $0.30；Shopify Payments Basic 方案 2.9%
#                （Grow 2.7% / Advanced 2.5% / Plus 约 2.15%），均加 $0.30 固定费；
#                PayPal 结账 3.49% + $0.49。跨境收款 Shopify Payments 另加 1.5% 货币转换费。
#                https://eightx.co/blog/average-ecommerce-payment-processing-fee-by-platform-2026
#                https://ecomcalctools.com/blog/stripe-fees-2026/
#
# ⚠️ 两点必读：
# 1. 佣金比例按类目和价格档位变化，本文件只取常见档位。实际项目必须逐个类目核对官方费率页。
# 2. 退货率（return_rate）**不是平台公布数据**，各家差异极大，只能用自己店铺历史订单统计。
#    下面的数值仍是**估算占位值**，已单独标注，不要当成真实数据引用。

amazon_fba:
  # 标准类目佣金 15%（家居厨房、运动户外、玩具、办公、工具等均为 15%）
  commission_rate: 0.15
  # FBA 模式下支付处理已含在佣金内，无单独支付费
  payment_fee_rate: 0.0
  # ⚠️ 以下退货率为估算占位值，非平台公布数据
  return_rate:
    default: 0.08
    baby_safety: 0.12
    beauty_health: 0.10
    electronics_accessory: 0.10   # 消费电子类佣金实际为 8%，见 platform 变体说明

amazon_fba_electronics:
  # 消费电子 / 电脑 / 大家电 / 游戏主机：佣金 8%（全类目最低档）
  commission_rate: 0.08
  payment_fee_rate: 0.0
  return_rate:
    default: 0.10
    electronics_accessory: 0.10

amazon_fba_apparel:
  # 服饰类：佣金 17%
  commission_rate: 0.17
  payment_fee_rate: 0.0
  return_rate:
    default: 0.20   # ⚠️ 估算占位值；服饰退货率行业普遍偏高

tiktok_shop:
  # 美区 referral fee 6%，已包含支付处理，无单独交易费
  commission_rate: 0.06
  payment_fee_rate: 0.0
  # ⚠️ 估算占位值
  return_rate:
    default: 0.06
    baby_safety: 0.10
    beauty_health: 0.09

tiktok_shop_new_seller:
  # 新卖家促销费率 3%（首单后 30 天内有效，到期恢复 6%）
  commission_rate: 0.03
  payment_fee_rate: 0.0
  return_rate:
    default: 0.06

independent_site:
  # 独立站无平台佣金
  commission_rate: 0.0
  # Stripe / Shopify Payments Basic 美区费率 2.9%
  # 注：真实模型还应计入每笔 $0.30 固定费和跨境 1.5% 货币转换费，本简化模型未计入
  payment_fee_rate: 0.029
  # ⚠️ 估算占位值
  return_rate:
    default: 0.05
    baby_safety: 0.10
    beauty_health: 0.08

independent_site_paypal:
  # PayPal 结账费率 3.49%（另有 $0.49 固定费，本模型未计入）
  commission_rate: 0.0
  payment_fee_rate: 0.0349
  return_rate:
    default: 0.05

# ══════════════════════════════════════════════════════════════
# 更多销售平台（2026-09-12 检索的公开费率）
#
# 来源：
#   eBay：final value fee 12.9%–15% + $0.30/单（本文件取 13%）
#         https://www.webgility.com/blog/ebay-fees
#   Walmart Marketplace：referral fee 6%–20% 按类目，含支付处理，无月费
#         https://www.spxcommerce.com/blog/marketplace-seller-fees-comparison/
#   Etsy：交易费 6.5% + 支付 3% + $0.25（美国卖家），另有 $0.20/listing
#         https://www.webgility.com/blog/etsy-vs-ebay
#   Temu：卖家佣金约 2%–5%
#         https://litcommerce.com/blog/how-to-sell-on-temu/
#   Shopee：本地 2%–8%；**跨境显著更高** —— 新加坡跨境约 14%，
#           马来西亚从 16.2% 升至 18.36%；2026-02 起新马泰越加收 5% 技术服务费
#         https://www.getonecart.com/shopee-seller-fees/
#         https://digitalinasia.com/shopee-lazada-tiktok-shop-fees-2026/
#   Lazada：标准卖家 2%–6.5%
#         https://www.getonecart.com/lazada-vs-shopee/
#
# ⚠️ 三点必读：
# 1. 这些是**常见档位**，实际按类目、店铺等级、活动浮动。用前必须核对平台官方费率页。
# 2. 含固定费（eBay $0.30/单、Etsy $0.25+$0.20/listing）的平台，本简化模型**未计入固定费**，
#    低客单价商品会被低估成本。
# 3. return_rate 全部是**估算占位值**，平台不公布，只能用自己店铺历史订单统计。

ebay:
  # final value fee 13%（12.9%–15% 区间中位），已含支付处理；每单另有 $0.30 固定费未计入
  commission_rate: 0.108
  payment_fee_rate: 0.0
  return_rate:
    default: 0.08
    electronics_accessory: 0.12

walmart:
  # referral fee 按类目 6%–20%，此处取常见档 12%，含支付处理
  commission_rate: 0.12
  payment_fee_rate: 0.0
  return_rate:
    default: 0.09

walmart_low_fee:
  # 低费率类目档（如部分消费电子），referral 约 6%
  commission_rate: 0.06
  payment_fee_rate: 0.0
  return_rate:
    default: 0.10

etsy:
  # 交易费 6.5% + Etsy Payments 3%（美国卖家）；$0.25/单与 $0.20/listing 未计入
  commission_rate: 0.065
  payment_fee_rate: 0.03
  return_rate:
    default: 0.06

temu:
  # 卖家佣金约 2%–5%，此处取 3.5%
  commission_rate: 0.035
  payment_fee_rate: 0.0
  return_rate:
    default: 0.10

shopee_local:
  # 本地卖家 2%–8%，此处取 5%
  commission_rate: 0.05
  payment_fee_rate: 0.0
  return_rate:
    default: 0.07

shopee_crossborder_sg:
  # 新加坡跨境约 14%，另计 2026-02 起的 5% 技术服务费（合计约 19%）
  commission_rate: 0.19
  payment_fee_rate: 0.0
  return_rate:
    default: 0.07

shopee_crossborder_my:
  # 马来西亚跨境 18.36%，另计 5% 技术服务费（合计约 23.4%）
  commission_rate: 0.234
  payment_fee_rate: 0.0
  return_rate:
    default: 0.07

lazada:
  # 标准卖家 2%–6.5%，此处取 5%
  commission_rate: 0.05
  payment_fee_rate: 0.0
  return_rate:
    default: 0.07


